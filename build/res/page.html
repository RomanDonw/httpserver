<!DOCTYPE html>
<html>
    <head>
        <style>
            :root {
                color-scheme: light;
            }

            form {
                border-style: inset;
                border-width: 1px;
                padding: 5px;
            }
        </style>
    </head>

    <body>
        <h1>Example page</h1>

        <hr>

        This is an example web page. <br> <br>
        It works! <br> <br>

        <a href="/serverinfo">Server local info</a> <br> <br>

        <form method=POST action="/postdata">
            Text: <input type=input name="text"> <br> <br>
            
            <input type=submit value="Submit data">
        </form>

        <hr>

        Page theme:
        <span id="themeselector">
            <input type=checkbox id="checkbox"> <span id="text"></span>
        </span>
        
        <script>
            const rootelement = document.querySelector(":root");
            const themeselector_checkbox = document.querySelector("#themeselector input[type=checkbox]#checkbox");
            const themeselector_textelement = document.querySelector("#themeselector #text");

            function settheme(isdark, updatecheckboxstate, setinlocalstorage)
            {
                rootelement.style.colorScheme = isdark ? "dark" : "light";
                themeselector_textelement.innerHTML = isdark ? "Dark" : "Light";
                if (updatecheckboxstate) themeselector_checkbox.checked = isdark;
                if (setinlocalstorage) localStorage.setItem("theme", isdark);
            }

            const savedtheme = localStorage.getItem("theme");
            if (savedtheme !== null) settheme(savedtheme, true, false);
            else settheme(false, true, false);
            
            themeselector.onclick = () => { settheme(themeselector_checkbox.checked, false, true); };
        </script>
    </body>
</html>
